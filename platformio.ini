; no-signal — 桌搭静电电视 (M5StickS3)
; 基线 = backrooms-walker v0.2.1 真机验证配置（dio + qio_opi PSRAM 实测可启动）

[env:sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = dio          ; qio 在 StickS3 黑屏（已验证坑）
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.psram = enable
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; ── 依赖钉版（可复现性）────────────────────────────────────────────────
; 发布件 v0.1.0 是用 M5Unified 0.2.21 + M5GFX 0.2.28 构建的（Arduino core 3.3.9 / ESP-IDF 5.5.4 /
; 工具链 xtensa-esp-elf 14.2.0）。两个库都显式钉住：M5Unified 只写 @0.2.21 时，它声明的
; M5GFX >= 0.2.28 会让平台在下次构建时悄悄拉上新版 M5GFX，产物与发布件不一致。
lib_deps =
  m5stack/M5Unified@0.2.21
  m5stack/M5GFX@0.2.28

; ── 发布版：关闭 harness + 排除凭据 ──
; ⚠ 不关 WiFi：SoftAP 保留给"首次扫码对时"（60s 超时后 WiFi OFF，见 timesync.h）
; 防护在 main.cpp: hrns.begin / server.begin / WiFi.begin(dev STA) 均在 #ifndef PRODUCTION_BUILD 内
; 发布前自检：strings -a .pio/build/sticks3-prod/firmware.bin | grep -c '<你的 SSID>' → 必须为 0
[env:sticks3-prod]
extends = env:sticks3
build_flags =
  ${env:sticks3.build_flags}
  -DPRODUCTION_BUILD=1
